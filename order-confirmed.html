<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Order Confirmed — Harmony</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Inter:wght@300;400;500&display=swap" media="print" onload="this.media='all'" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Inter:wght@300;400;500&display=swap" /></noscript>
  <link rel="stylesheet" href="css/style.min.css" />
  <style>
    .confirm-wrap {
      min-height: 70vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.5rem;
    }
    .confirm-card {
      max-width: 480px;
      text-align: center;
      background: var(--cream-light);
      border: 1px solid var(--border);
      padding: 3rem 2.5rem;
    }
    .confirm-icon {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--ink);
      color: var(--cream);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
      font-size: 1.6rem;
    }
    .confirm-icon.pending { background: var(--gold); }
    .confirm-title { font-family: var(--font-heading); font-size: 1.8rem; color: var(--ink); font-weight: 500; margin-bottom: 0.6rem; }
    .confirm-sub { font-size: 0.88rem; color: var(--mist); line-height: 1.6; margin-bottom: 1.6rem; }
    .confirm-order-id { font-family: var(--font-heading); font-size: 1.1rem; color: var(--ink); background: var(--cream); border: 1px solid var(--border); padding: 0.6rem 1.2rem; display: inline-block; margin-bottom: 2rem; letter-spacing: 0.02em; }
    .confirm-note { font-size: 0.78rem; color: var(--stone); line-height: 1.6; margin-bottom: 2rem; }
  </style>
</head>
<body>

  <nav class="nav nav--solid">
    <div class="nav__inner">
      <a href="index.html" class="nav__logo">Harmony<span>.</span></a>
      <ul class="nav__links">
        <li><a href="index.html">Home</a></li>
        <li><a href="products.html">Wholesale</a></li>
        <li><a href="shop.html">Marketplace</a></li>
      </ul>
    </div>
  </nav>

  <div class="confirm-wrap">
    <div class="confirm-card" id="confirm-card">
      <!-- filled in by script -->
    </div>
  </div>

  <script>
    function renderConfirmation() {
      const params = new URLSearchParams(window.location.search);
      const orderId = params.get('order') || '';
      const status = params.get('status') || '';
      const card = document.getElementById('confirm-card');

      const isCompleted = status === 'completed';

      card.innerHTML = `
        <div class="confirm-icon ${isCompleted ? '' : 'pending'}">${isCompleted ? '✓' : '…'}</div>
        <h1 class="confirm-title">${isCompleted ? 'Order Confirmed' : 'Payment Processing'}</h1>
        <p class="confirm-sub">
          ${isCompleted
            ? 'Thank you! Your payment has gone through and your order is being prepared.'
            : 'We\'re confirming your payment — this can take a moment. You\'ll receive a WhatsApp or email update shortly.'}
        </p>
        ${orderId ? `<div class="confirm-order-id">Order ${orderId}</div>` : ''}
        <p class="confirm-note">
          We deliver only, next working day (T+1) from order confirmation. Our team will be in touch with delivery details.
          If you have any questions, WhatsApp us at +65 8795 3309.
        </p>
        <a href="shop.html" class="btn btn-primary">Continue Shopping</a>
      `;
    }
    document.addEventListener('DOMContentLoaded', renderConfirmation);
  </script>
</body>
</html>
